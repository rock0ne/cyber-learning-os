name: CyberLearningOS
options:
  bundleIdPrefix: uk.cybertecpro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  CyberLearningOS:
    type: application
    platform: iOS
    sources:
      - path: CyberLearningOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.cybertecpro.CyberLearningOS
        PRODUCT_NAME: Cyber Learning OS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cyber Learning OS
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - CyberLearningOSTests
  CyberLearningOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CyberLearningOSTests
    dependencies:
      - target: CyberLearningOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
